<style>
  :root {
    --bg: #f6f7fb;
    --surface: #ffffff;
    --surface-muted: #f1f2f7;
    --border: #e2e4ec;
    --text: #191b28;
    --text-muted: #5b5f74;
    --text-faint: #8f93a8;
    --accent: #4338ca;
    --accent-soft: #eeecfd;
    --danger: #b3261e;
    --danger-soft: #fbe9e7;
    --warning: #92400e;
    --warning-soft: #fdf1dc;
    --success: #146c43;
    --success-soft: #e7f6ed;
    --radius-sm: 8px;
    --radius-lg: 16px;
    --shadow-card: 0 1px 2px rgba(20, 21, 38, 0.04), 0 8px 24px -12px rgba(20, 21, 38, 0.10);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .report-page {
    max-width: 780px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  .report-header {
    margin-bottom: 28px;
  }

  .report-header__eyebrow {
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 8px;
  }

  .report-header h1 {
    font-size: 1.7rem;
    letter-spacing: -0.02em;
    margin: 0;
  }

  .report-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    padding: 26px 28px;
    margin-bottom: 20px;
  }

  .report-section h2 {
    font-size: 1.02rem;
    margin: 0 0 16px;
    letter-spacing: -0.01em;
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }

  .section-header h2 {
    margin: 0;
  }

  .btn-toggle {
    appearance: none;
    flex-shrink: 0;
    border: 1px solid var(--border-strong, #c7cadb);
    background: var(--surface);
    color: var(--accent);
    font-family: var(--font);
    font-size: 0.8rem;
    font-weight: 650;
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
  }

  .btn-toggle:hover {
    background: var(--accent-soft);
  }

  .item-groups {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .report-section > p.empty-state,
  .report-section .empty-state {
    color: var(--text-muted);
    font-size: 0.92rem;
    margin: 0;
  }

  .notice {
    border: 1px solid rgba(146, 64, 14, 0.2);
    background: var(--warning-soft);
    color: var(--warning);
    border-radius: var(--radius-lg);
    padding: 18px 22px;
    margin-bottom: 20px;
  }

  .notice h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0 0 8px;
  }

  .notice ul {
    margin: 0;
    padding-left: 18px;
  }

  .notice li {
    font-size: 0.88rem;
  }

  dl.kv {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 8px 18px;
    margin: 0 0 14px;
  }

  dl.kv dt {
    font-size: 0.85rem;
    color: var(--text-muted);
    font-weight: 600;
  }

  dl.kv dd {
    font-size: 0.92rem;
    margin: 0;
  }

  .meta-line {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin: 4px 0 0;
  }

  .item-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .item-row {
    border: 1px solid var(--border);
    border-left: 3px solid var(--border-strong, #c7cadb);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    background: var(--surface-muted);
  }

  .item-row--rgpd {
    border-left-color: var(--warning);
  }

  .item-row--nonconformite {
    border-left-color: var(--danger);
  }

  .item-row__top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }

  .badge {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    padding: 3px 9px;
    border-radius: 999px;
  }

  .badge--rgpd {
    background: var(--warning-soft);
    color: var(--warning);
  }

  .badge--nonconformite {
    background: var(--danger-soft);
    color: var(--danger);
  }

  .item-row__source {
    font-size: 0.8rem;
    color: var(--text-faint);
  }

  .item-row p {
    margin: 0;
    font-size: 0.9rem;
  }

  .item-row code {
    background: rgba(20, 21, 38, 0.06);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 0.85em;
  }

  .item-row__ref {
    font-size: 0.78rem;
    color: var(--text-faint);
    margin-top: 4px;
  }

  .tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .tag {
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.78rem;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
  }

  .stat-row {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
  }

  .stat {
    min-width: 160px;
  }

  .stat__label {
    font-size: 0.78rem;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0 0 4px;
  }

  .stat__value {
    font-size: 1rem;
    font-weight: 650;
  }

  .download-row {
    margin-top: 8px;
  }

  .btn {
    appearance: none;
    border: none;
    font-family: var(--font);
    font-size: 0.92rem;
    font-weight: 650;
    border-radius: var(--radius-sm);
    padding: 12px 20px;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
  }

  .btn:hover {
    background: #362f9e;
  }
</style>
